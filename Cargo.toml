[package]
name = "axiom-rag"
version = "0.1.0"
edition = "2021"
description = "Agentic RAG with verifier-gated retrieval loops. Zero API keys, fully offline."
license = "MIT"
repository = "https://github.com/fernandogarzaaa/axiom-rag"
keywords = ["rag", "retrieval", "agents", "embeddings", "offline"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "axiom-rag"
path = "src/main.rs"

[lib]
name = "axiom_rag"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdf-extract = "0.7"
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
