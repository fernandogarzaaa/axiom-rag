name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --locked --verbose

      - name: Build axiom-agent-task (AXIOM-AETHER)
        run: |
          git clone --depth 1 https://github.com/fernandogarzaaa/AXIOM-AETHER /tmp/axiom-aether
          cargo build --bin axiom-agent-task --manifest-path /tmp/axiom-aether/axiom_engine_rs/Cargo.toml

      - name: Test (including improve loop against the real binary)
        run: cargo test --locked --verbose
        env:
          AXIOM_AGENT_TASK_BIN: /tmp/axiom-aether/axiom_engine_rs/target/debug/axiom-agent-task

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check
